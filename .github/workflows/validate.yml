name: Validate prototype

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: Prototype/clinical-training-hub

jobs:
  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: Prototype/clinical-training-hub/package-lock.json
      - run: npm ci
      - run: npm run build

  backend:
    name: Backend (${{ matrix.database }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        database: [sqlite, postgresql]
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: training_hub_test
          POSTGRES_USER: hub
          POSTGRES_PASSWORD: ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hub -d training_hub_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      TEST_DATABASE_URL: ${{ matrix.database == 'postgresql' && 'postgresql+psycopg://hub:ci-only@127.0.0.1:5432/training_hub_test' || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            Prototype/clinical-training-hub/requirements.txt
            Prototype/clinical-training-hub/requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - name: Check imports and Python syntax
        run: python -m ruff check backend scripts tests
      - name: Check Python formatting
        run: python -m ruff format --check backend scripts tests
      - name: Verify architecture, migrations and application workflows
        run: python -m unittest discover -s tests -v
