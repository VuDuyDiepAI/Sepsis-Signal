name: Frontend checks
on:
  pull_request:
    paths:
      - 'frontend/**'
      - 'src/**'
      - 'scripts/**'
      - 'requirements.txt'
      - 'requirements-dev.txt'
      - 'artifacts/**'
      - 'data/**'
      - '.github/workflows/frontend.yml'
  push:
    branches: ['main', 'feat/clinical-ui-refresh']
    paths:
      - 'frontend/**'
      - 'src/**'
      - 'scripts/**'
      - 'requirements.txt'
      - 'requirements-dev.txt'
      - 'artifacts/**'
      - 'data/**'
      - '.github/workflows/frontend.yml'
permissions:
  contents: read
jobs:
  frontend:
    name: Next.js checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11'
      - run: python -m pip install -r ../requirements.txt
      - run: npx playwright install --with-deps chromium
      - name: Run production Playwright E2E
        id: e2e
        run: npm run test:e2e
      - name: Diagnose hydration with development React build
        if: failure() && steps.e2e.outcome == 'failure'
        continue-on-error: true
        run: SEPSIS_E2E_DEV=1 npx playwright test --grep "responsive 1440px" --retries=0

      - name: Upload Playwright diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            frontend/test-results/
            frontend/playwright-report/
          retention-days: 7
          if-no-files-found: warn
