name: Frontend checks
on:
  pull_request:
  push:
    branches: ['main', 'feat/clinical-ui-refresh', 'codex/**']
  merge_group:
    types: [checks_requested]
# Always create the same check, including documentation-only PRs. Workflow-level
# path filters can leave a required check pending indefinitely.
permissions:
  contents: read
jobs:
  frontend:
    name: Next.js checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: sepsis
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: sepsis_e2e_test
        ports: [5432:5432]
        options: --health-cmd "pg_isready -U sepsis -d sepsis_e2e_test" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      SEPSIS_E2E_DATABASE_URL: postgresql+psycopg://sepsis:ci-only-password@127.0.0.1:5432/sepsis_e2e_test
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-api.txt
      - run: python -m pip install -r ../requirements-api.txt
      # Keep the legacy required-check name until branch protection is updated.
      # The application now uses React/Vite; E2E calls FastAPI and real Python scoring.
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Run production Playwright E2E
        id: e2e
        run: npm run test:e2e
      - name: Build runtime image and validate Python model imports
        working-directory: ${{ github.workspace }}
        run: docker build --tag sepsis-signal-ci .
      - name: Upload Playwright diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            frontend/test-results/
            frontend/playwright-report/
          retention-days: 7
          if-no-files-found: warn
