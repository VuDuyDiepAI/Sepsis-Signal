name: Frontend checks
on:
  pull_request:
    paths: ['frontend/**', 'scripts/export_frontend_demo.py', '.github/workflows/frontend.yml']
  push:
    branches: ['feat/clinical-ui-refresh']
    paths: ['frontend/**', 'scripts/export_frontend_demo.py', '.github/workflows/frontend.yml']
permissions:
  contents: read
jobs:
  frontend:
    name: Next.js checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
